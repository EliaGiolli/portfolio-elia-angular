<header class="navbar">
  <div class="navbar-container">
    <a routerLink="/" class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="32" height="32" aria-hidden="true">
        <rect width="40" height="40" rx="8" fill="#2D44FF"/>
        <polyline points="8,12 17,20 8,28" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="20" y1="28" x2="33" y2="28" stroke="white" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <span>GIOLLI DESIGN</span>
    </a>

    <button
      class="mobile-toggle"
      (click)="toggleMenu()"
      [attr.aria-label]="isMenuOpen() ? 'Close navigation menu' : 'Open navigation menu'"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="main-nav"
    >
      <app-icon
        [name]="isMenuOpen() ? CLOSE_ICON : MENU_ICON"
        [size]="28"
        [decorative]="true"
      />
    </button>

    <nav
      id="main-nav"
      aria-label="Main navigation"
      [class.open]="isMenuOpen()"
    >
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" ariaCurrentWhenActive="page" (click)="isMenuOpen.set(false)">Homepage</a>
      <a routerLink="/about" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="isMenuOpen.set(false)">About me</a>
      <a routerLink="/projects" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="isMenuOpen.set(false)">My projects</a>
      <a routerLink="/contacts" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="isMenuOpen.set(false)">Contact me</a>
    </nav>
  </div>
</header>
